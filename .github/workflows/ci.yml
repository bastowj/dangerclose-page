name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
# Every action below runs natively on Node 24, so no
# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 shim is needed. Keep it that way when
# bumping: a Node 20 action would reintroduce the deprecation warning.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint is both gates: eslint --max-warnings 0 and prettier --check.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
